    <text x="180" y="83" font-size="43" font-weight="750" letter-spacing="1">PERÚ MAR</text>
    <text x="182" y="111" font-size="18" font-weight="450" letter-spacing=".4">Gestión Académica</text>
  </g>
</svg>
