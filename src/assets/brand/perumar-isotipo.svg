<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 164" role="img" aria-labelledby="pm-isotype-title pm-isotype-desc">
  <title id="pm-isotype-title">PERÚ MAR — isotipo institucional</title>
  <desc id="pm-isotype-desc">Timón con ancla detrás, Perú en el centro y Mar de Grau al oeste. Una T superior incorpora acentos rojos peruanos.</desc>
  <!-- Anchor: entirely behind the wheel and its opaque medallion. -->
  <g id="anchor" fill="none" stroke="var(--pm-ink, #173d50)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 29v116M34 105c5 18 22 32 46 42 24-10 41-24 46-42"/>
    <path d="m34 101-3 17 15-9m80-8 3 17-15-9"/>
  </g>
  <!-- Institutional T and Peruvian red accents, above rather than inside the wheel. -->
  <g id="institutional-t" stroke="var(--pm-ink, #173d50)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M57 13h46v15H86v15H74V28H57Z" fill="var(--pm-paper, #fffaf0)"/>
    <path d="M59 15h13v11H59Zm29 0h13v11H88Z" fill="var(--pm-red, #bb3544)" stroke="none"/>
  </g>
  <!-- Wheel: broad rim and restrained handles, without an internal cross. -->
  <g id="wheel" stroke="var(--pm-wheel, #947044)" stroke-linecap="round">
    <path d="M23 83h14m86 0h14M40 43l10 10m60 60 10 10M40 123l10-10m60-60 10-10M80 127v12" fill="none" stroke-width="9"/>
    <circle cx="80" cy="83" r="44" fill="var(--pm-paper, #fffaf0)" stroke-width="9"/>
  </g>
  <!-- Neutral land remains north and east. Only the western sector suggests sea. -->
  <g id="peru-and-mar-de-grau">
    <path id="western-sea" d="M62.82 61.71 L60.06 63.92 L58.99 66.37 L60.66 69.71 L59.54 71.27 L62.00 72.69 L64.69 74.97 L65.77 77.55 L67.19 79.14 L70.45 86.11 L73.86 92.57 L76.78 97.16 L76.21 98.17 L77.65 101.06 L80.31 103.21 L86.50 107.04 L79.00 107.04 L72.81 103.21 L70.15 101.06 L68.71 98.17 L69.28 97.16 L66.36 92.57 L62.95 86.11 L59.69 79.14 L58.27 77.55 L57.19 74.97 L54.50 72.69 L52.04 71.27 L53.16 69.71 L51.49 66.37 L52.56 63.92 L55.32 61.71Z" fill="var(--pm-sea, #39758a)"/>
    <path id="sea-lines" d="M61.59 80q1-1 2 0t2 0 M68.77 94q1-1 2 0t2 0" fill="none" stroke="var(--pm-paper, #fffaf0)" stroke-width="1.4" stroke-linecap="round"/>
    <path id="peru" d="M98.77 64.84 L95.66 64.68 L95.19 65.20 L92.36 65.87 L88.41 68.26 L88.16 69.89 L87.28 71.11 L87.62 73.00 L85.54 74.01 L85.54 75.49 L84.63 76.13 L86.07 79.28 L87.99 81.41 L87.26 82.91 L89.55 83.11 L90.85 84.98 L93.90 85.07 L96.74 83.01 L96.51 88.32 L98.08 88.72 L100.03 88.12 L103.01 93.75 L102.27 94.94 L102.10 97.40 L102.03 100.37 L100.68 102.12 L101.30 103.42 L100.51 104.60 L101.99 107.54 L99.82 111.31 L98.89 113.11 L97.11 114.00 L93.65 111.99 L93.35 110.56 L86.50 107.04 L80.31 103.21 L77.65 101.06 L76.21 98.17 L76.78 97.16 L73.86 92.57 L70.45 86.11 L67.19 79.14 L65.77 77.55 L64.69 74.97 L62.00 72.69 L59.54 71.27 L60.66 69.71 L58.99 66.37 L60.06 63.92 L62.82 61.71 L63.23 63.17 L62.24 64.00 L62.33 65.29 L63.76 65.01 L65.16 65.39 L66.61 67.15 L68.56 65.71 L69.21 63.35 L71.33 60.31 L75.48 58.93 L79.25 55.26 L80.32 52.99 L79.84 50.33 L80.76 50.00 L83.06 51.66 L84.16 53.31 L85.76 54.21 L87.80 57.88 L90.37 58.32 L92.27 57.39 L93.52 58.00 L95.59 57.70 L98.24 59.34 L96.01 62.90 L97.04 62.98Z" fill="var(--pm-ink, #173d50)" stroke="var(--pm-paper, #fffaf0)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
