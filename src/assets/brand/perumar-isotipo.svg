<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 164" role="img" aria-labelledby="pm-isotype-title pm-isotype-desc">
  <title id="pm-isotype-title">PERÚ MAR — isotipo institucional</title>
  <desc id="pm-isotype-desc">Timón con ancla detrás, Perú en el centro y Mar de Grau al oeste. Una T superior incorpora acentos rojos peruanos.</desc>
  <!-- Anchor: entirely behind the wheel and its opaque medallion. -->
  <g id="anchor" fill="none" stroke="var(--pm-ink, #173d50)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 29v116M34 105c5 18 22 32 46 42 24-10 41-24 46-42"/>
    <path d="m34 101-3 17 15-9m80-8 3 17-15-9"/>
  </g>
  <!-- Institutional T and Peruvian red accents, above rather than inside the wheel. -->
  <g id="institutional-t" transform="translate(80 43) scale(.88 .64) translate(-80 -43)" stroke="var(--pm-ink, #173d50)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M57 13h46v15H86v15H74V28H57Z" fill="var(--pm-paper, #fffaf0)"/>
    <path d="M59 15h13v11H59Zm29 0h13v11H88Z" fill="var(--pm-red, #bb3544)" stroke="none"/>
  </g>
  <!-- Wheel: broad rim and restrained handles, without an internal cross. -->
  <g id="wheel" stroke="var(--pm-wheel, #947044)" stroke-linecap="round">
    <path d="M23 83h14m86 0h14M40 43l10 10m60 60 10 10M40 123l10-10m60-60 10-10M80 127v12" fill="none" stroke-width="9"/>
    <circle cx="80" cy="83" r="44" fill="var(--pm-paper, #fffaf0)" stroke-width="9"/>
  </g>
  <!-- Neutral land remains north and east. Only the western sector suggests sea. -->
  <g id="peru-and-mar-de-grau" transform="translate(80 83) scale(1.26) translate(-80 -83)">
    <path id="western-sea" d="M66.79 67.15 L64.64 68.88 L63.80 70.79 L65.11 73.40 L64.24 74.62 L66.16 75.73 L68.26 77.51 L69.11 79.52 L70.21 80.77 L72.76 86.21 L75.42 91.26 L77.70 94.84 L77.26 95.63 L78.38 97.89 L80.46 99.57 L85.30 102.56 L79.44 102.56 L74.60 99.57 L72.52 97.89 L71.40 95.63 L71.85 94.84 L69.56 91.26 L66.90 86.21 L64.35 80.77 L63.25 79.52 L62.40 77.51 L60.30 75.73 L58.38 74.62 L59.25 73.40 L57.94 70.79 L58.78 68.88 L60.93 67.15Z" fill="var(--pm-sea, #39758a)"/>
    <path id="sea-lines" d="M65.26 81q.8-.7 1.6 0t1.6 0 M70.22 91q.8-.7 1.6 0t1.6 0" fill="none" stroke="var(--pm-paper, #fffaf0)" stroke-width="1.1" stroke-linecap="round"/>
    <path id="peru" d="M94.88 69.59 L92.45 69.46 L92.09 69.88 L89.88 70.40 L86.79 72.26 L86.60 73.54 L85.91 74.49 L86.18 75.97 L84.54 76.76 L84.55 77.91 L83.84 78.41 L84.96 80.87 L86.46 82.54 L85.89 83.71 L87.68 83.87 L88.70 85.33 L91.08 85.40 L93.29 83.79 L93.11 87.94 L94.34 88.25 L95.86 87.78 L98.20 92.18 L97.62 93.11 L97.48 95.03 L97.43 97.35 L96.38 98.72 L96.86 99.73 L96.24 100.65 L97.40 102.95 L95.70 105.90 L94.98 107.30 L93.59 108.00 L90.88 106.43 L90.65 105.31 L85.30 102.56 L80.46 99.57 L78.38 97.89 L77.26 95.63 L77.70 94.84 L75.42 91.26 L72.76 86.21 L70.21 80.77 L69.11 79.52 L68.26 77.51 L66.16 75.73 L64.24 74.62 L65.11 73.40 L63.80 70.79 L64.64 68.88 L66.79 67.15 L67.11 68.29 L66.34 68.94 L66.42 69.94 L67.53 69.72 L68.62 70.02 L69.75 71.40 L71.28 70.28 L71.79 68.43 L73.44 66.05 L76.69 64.97 L79.63 62.11 L80.47 60.34 L80.10 58.26 L80.81 58.00 L82.61 59.29 L83.47 60.58 L84.72 61.29 L86.31 64.16 L88.32 64.50 L89.81 63.78 L90.78 64.25 L92.40 64.01 L94.47 65.29 L92.73 68.08 L93.53 68.14Z" fill="var(--pm-ink, #173d50)"/>
    <path id="western-coast" d="M66.79 67.15 L64.64 68.88 L63.80 70.79 L65.11 73.40 L64.24 74.62 L66.16 75.73 L68.26 77.51 L69.11 79.52 L70.21 80.77 L72.76 86.21 L75.42 91.26 L77.70 94.84 L77.26 95.63 L78.38 97.89 L80.46 99.57 L85.30 102.56 L90.65 105.31 L90.88 106.43 L93.59 108.00" fill="none" stroke="var(--pm-paper, #fffaf0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
